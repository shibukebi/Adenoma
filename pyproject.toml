[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adenoma-agent"
version = "0.1.0"
description = "ROI/patch-level pathology segmentation agent MVP for adenoma slides"
requires-python = ">=3.8"
dependencies = [
  "PyYAML>=6.0",
  "Pillow>=9.0",
  "numpy>=1.20",
  "requests>=2.28",
]

[project.optional-dependencies]
contracts = [
  "jsonschema>=4.18",
]
test = [
  "pytest>=7.4",
]
architecture-baseline = [
  "fastapi>=0.100",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "timm>=0.9",
  "torch>=2.1",
  "torchvision>=0.16",
  "uvicorn>=0.23",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
