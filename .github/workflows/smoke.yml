name: Python smoke tests

on:
  push:
  pull_request:

jobs:
  challenge-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install review dependencies
        run: python -m pip install -r challenge_review/requirements.txt
      - name: Compile project Python files
        run: python -m compileall -q dsmil patch_gcn transmil transmil_official challenge_review scripts third_party/mist baseline
      - name: Run review API and cache tests
        run: PYTHONPATH=. pytest -q challenge_review/tests/test_app.py challenge_review/tests/test_wsi_cache.py tests/test_benchmark_layout.py
