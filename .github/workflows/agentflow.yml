name: AgentFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  agentflow-current:
    name: agentflow-current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install current test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[contracts,test]"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
      - name: Run current AgentFlow gates
        run: python scripts/run_agentflow_ci.py

  legacy-regression:
    name: legacy-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[contracts,test]"
      - name: Run legacy tests against reviewed baseline
        run: python scripts/run_legacy_ci.py
